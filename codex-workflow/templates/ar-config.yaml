# AR 工作流项目配置 — 复制到目标仓库根 codespec/.ar/config.yaml
language: zh-CN

# Build Executor 初始为 ask；首次 Build 先选候选，再定向探测
# Executor 选择：ask | current | opencode
default_executor: ask

# OpenCode transport for new ARs: server uses the bundled MCP Broker; null keeps legacy CLI behavior.
opencode_transport: server

# 可选；仅当 default_executor: opencode 时生效。值是 OpenCode agent ID，不是模型名
# 在 ~/.config/opencode/agents/ 或项目 .opencode/agents/ 安装对应 profile 后再启用
# opencode_worker_agent: ar-worker-deepseek

# 模块分节表：归档合并时按 id 定位 SPEC.md / DESIGN.md 中的分节锚点
# 新增模块时在此登记，并在 codespec/SPEC.md、codespec/DESIGN.md 建立对应分节
modules:
  - id: auth
    label: 认证
    spec_section: "## 模块：认证（auth）"
    design_section: "## 模块：认证（auth）"
  - id: user
    label: 用户
    spec_section: "## 模块：用户（user）"
    design_section: "## 模块：用户（user）"
